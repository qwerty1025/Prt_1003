<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XP-Q90EC 藍牙列印 (CP936 修復版)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- CRITICAL: Using cptable for Code Page 936 (GBK) encoding to fix thermal printer mojibake -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/cpexcel.js"></script>

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #0f172a; /* Slate 900 */
      color: #f1f5f9; /* Slate 100 */
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar for logs */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-indigo-500 selection:text-white">
  
  <div class="max-w-md mx-auto p-4 flex flex-col gap-5">
    
    <!-- Header Card -->
    <header class="bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-white">XP-Q90EC 測試器</h1>
            <p class="text-[11px] text-emerald-400 font-mono">編碼引擎: CP936 (GB18030)</p>
          </div>
        </div>
        <div id="connStatus" class="flex flex-col items-end">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-rose-500/20 text-rose-400 border border-rose-500/30 shadow-inner">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
            未連線
          </span>
        </div>
      </div>
    </header>

    <!-- Connection Controls -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex flex-col gap-3">
      <h2 class="text-sm font-semibold text-slate-300">藍牙裝置控制</h2>
      <div class="grid grid-cols-2 gap-3">
        <button id="btnConnect" onclick="connectPrinter()" class="w-full py-3 px-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all rounded-xl font-medium text-sm text-white shadow-md shadow-indigo-600/25 flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
          搜尋並連線
        </button>
        <button id="btnDisconnect" onclick="disconnectPrinter()" disabled class="w-full py-3 px-2 bg-slate-700/80 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed transition-all rounded-xl font-medium text-sm text-slate-300 flex items-center justify-center gap-1">
          中斷連線
        </button>
      </div>
      <p id="btSupportNotice" class="text-[11px] text-slate-400 text-center font-mono mt-1">環境檢查中...</p>
    </section>

    <!-- Test Print Action -->
    <section class="bg-gradient-to-br from-slate-800 to-indigo-900/30 border border-indigo-500/30 rounded-2xl p-5 shadow-lg flex flex-col items-center">
      <div class="mb-4 text-center">
        <p class="text-xs text-indigo-300 font-semibold tracking-wider mb-1">準備列印</p>
        <h3 class="text-xl font-bold text-white">咩味時刻工作室</h3>
        <p class="text-sm text-slate-400">(五寮尖山羊乳)</p>
      </div>
      
      <button onclick="printTestReceipt()" class="w-full py-4 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-xl font-bold text-base shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        列印防亂碼測試單
      </button>
      
      <p class="text-[10px] text-slate-400 mt-3 text-center leading-relaxed">
        將使用 <code class="bg-slate-900 px-1 py-0.5 rounded text-indigo-300">cptable.utils.encode(936)</code><br>並傳送 FS & 啟用漢字模式
      </p>
    </section>

    <!-- Logs -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex flex-col gap-2 h-48">
      <div class="flex items-center justify-between pb-2 border-b border-slate-700/50">
        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> 系統日誌
        </span>
        <button onclick="clearLogs()" class="text-[11px] text-slate-400 hover:text-white transition-colors">清除</button>
      </div>
      <div id="logConsole" class="flex-1 overflow-y-auto text-[11px] font-mono space-y-1 pr-1">
        <!-- Logs injected here -->
      </div>
    </section>

  </div>

  <script>
    // --- Bluetooth State ---
    let bluetoothDevice = null;
    let bluetoothServer = null;
    let printerCharacteristic = null;

    // Common UUIDs for Thermal Printers
    const SERVICE_UUIDS = [
      '000018f0-0000-1000-8000-00805f9b34fb', // Standard POS Service
      '49535343-fe7d-4ae5-8fa9-9fafd205e455', // ISSC
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
    ];
    
    const CHUNK_SIZE = 100; // MTU safe chunk size

    // --- Logging Utility ---
    function log(msg, type = 'info') {
      const consoleEl = document.getElementById('logConsole');
      const time = new Date().toLocaleTimeString('en-US', { hour12: false, fractionalSecondDigits: 2 });
      
      const div = document.createElement('div');
      let colorClass = 'text-slate-300';
      if (type === 'error') colorClass = 'text-rose-400 font-bold';
      if (type === 'success') colorClass = 'text-emerald-400';
      if (type === 'warn') colorClass = 'text-amber-300';
      
      div.className = `${colorClass} leading-tight break-all pb-1`;
      div.innerHTML = `<span class="text-slate-500">[${time}]</span> ${msg}`;
      
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('logConsole').innerHTML = '';
      log('日誌已清除');
    }

    // --- Initialization Check ---
    window.onload = function() {
      const notice = document.getElementById('btSupportNotice');
      if (navigator.bluetooth) {
        notice.textContent = '✔️ Web Bluetooth API 已就緒 (Bluefy 相容)';
        notice.className = 'text-[11px] text-emerald-400 text-center font-mono mt-1';
        log('藍牙環境檢查通過');
      } else {
        notice.textContent = '❌ 瀏覽器不支援 Web Bluetooth';
        notice.className = 'text-[11px] text-rose-400 text-center font-mono mt-1';
        log('錯誤：請在 iOS 使用 Bluefy Browser 開啟此網頁', 'error');
      }

      if (typeof cptable !== 'undefined') {
        log('CP936 編碼庫 (cpexcel.js) 載入成功', 'success');
      } else {
        log('警告：CP936 編碼庫尚未載入', 'error');
      }
    };

    // --- STREAMING_CHUNK:Bluetooth Connection Logic... ---
    async function connectPrinter() {
      if (!navigator.bluetooth) {
        alert("請使用支援 Web Bluetooth 的瀏覽器 (如 iOS Bluefy 或 Android Chrome)。");
        return;
      }

      try {
        log('請求藍牙裝置配對 (請選擇 XP-Q90EC)...');
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [...SERVICE_UUIDS, 'generic_access']
        });

        log(`已選擇: ${bluetoothDevice.name || 'Unknown Device'}`, 'success');
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log('正在連接 GATT 伺服器...');
        bluetoothServer = await bluetoothDevice.gatt.connect();
        
        log('正在尋找寫入特徵值 (Characteristic)...');
        printerCharacteristic = await findWritableCharacteristic(bluetoothServer);

        if (printerCharacteristic) {
          updateUI(true);
          log('✅ 印表機連線準備就緒！', 'success');
        } else {
          throw new Error('未找到支援寫入的藍牙特徵值');
        }
      } catch (err) {
        log(`連線失敗: ${err.message}`, 'error');
        updateUI(false);
      }
    }

    async function findWritableCharacteristic(server) {
      // 1. Try known services
      for (let uuid of SERVICE_UUIDS) {
        try {
          const service = await server.getPrimaryService(uuid);
          const chars = await service.getCharacteristics();
          for (let char of chars) {
            if (char.properties.write || char.properties.writeWithoutResponse) {
              log(`找到寫入點 (Service: ${uuid.split('-')[0]})`);
              return char;
            }
          }
        } catch(e) {}
      }
      
      // 2. Fallback: scan all services
      try {
        const services = await server.getPrimaryServices();
        for (let service of services) {
          const chars = await service.getCharacteristics();
          for (let char of chars) {
            if (char.properties.write || char.properties.writeWithoutResponse) {
              log(`找到寫入點 (Fallback UUID: ${char.uuid})`);
              return char;
            }
          }
        }
      } catch(e) {}
      return null;
    }

    function onDisconnected() {
      log('藍牙連線已中斷', 'warn');
      updateUI(false);
      bluetoothServer = null;
      printerCharacteristic = null;
    }

    function disconnectPrinter() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        log('正在手動中斷連線...');
        bluetoothDevice.gatt.disconnect();
      }
    }

    function updateUI(isConnected) {
      const statusDiv = document.getElementById('connStatus');
      const btnConnect = document.getElementById('btnConnect');
      const btnDisconnect = document.getElementById('btnDisconnect');

      if (isConnected) {
        statusDiv.innerHTML = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shadow-inner">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 已連線
          </span>`;
        btnConnect.classList.add('opacity-50', 'pointer-events-none');
        btnDisconnect.disabled = false;
      } else {
        statusDiv.innerHTML = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-rose-500/20 text-rose-400 border border-rose-500/30 shadow-inner">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> 未連線
          </span>`;
        btnConnect.classList.remove('opacity-50', 'pointer-events-none');
        btnDisconnect.disabled = true;
      }
    }

    // --- STREAMING_CHUNK:Printing & Encoding Logic... ---

    // Encode string to CP936 (GBK) Uint8Array using cptable
    function encodeToCP936(text) {
      if (typeof cptable === 'undefined') {
        throw new Error("CP936 編碼庫未載入，無法轉換中文字元");
      }
      // cptable.utils.encode returns an Array of bytes or Uint8Array directly
      const encoded = cptable.utils.encode(936, text);
      return new Uint8Array(encoded);
    }

    // Send payload in chunks to avoid GATT MTU limit drops
    async function sendRawBytes(payloadBytes) {
      if (!printerCharacteristic) {
        alert("請先連線至印表機");
        return false;
      }

      const total = payloadBytes.length;
      let offset = 0;
      
      log(`開始傳送資料，總大小: ${total} bytes...`);

      try {
        while (offset < total) {
          const chunk = payloadBytes.slice(offset, offset + CHUNK_SIZE);
          
          if (printerCharacteristic.properties.writeWithoutResponse) {
            await printerCharacteristic.writeValueWithoutResponse(chunk);
          } else {
            await printerCharacteristic.writeValue(chunk);
          }
          
          offset += CHUNK_SIZE;
          // Small delay to let hardware buffer process
          await new Promise(resolve => setTimeout(resolve, 20)); 
        }
        log(`✅ 成功傳送 ${total} bytes`, 'success');
        return true;
      } catch (err) {
        log(`❌ 傳送失敗: ${err.message}`, 'error');
        return false;
      }
    }

    async function printTestReceipt() {
      if (!printerCharacteristic) {
        log('請先點擊「搜尋並連線」', 'warn');
        return;
      }

      try {
        log('建構 ESC/POS 測試列印指令...');
        const payload = [];

        // Helper to push bytes to payload
        const addBytes = (arr) => {
          for(let i=0; i<arr.length; i++) payload.push(arr[i]);
        };

        // 1. 初始化印表機 (ESC @)
        addBytes([0x1B, 0x40]); 
        
        // 2. 啟用漢字模式 (FS &) - 關鍵防亂碼指令
        addBytes([0x1C, 0x26]); 
        
        // 3. 置中對齊 (ESC a 1)
        addBytes([0x1B, 0x61, 0x01]); 

        const headerStr = 
          "========================\n" +
          "      咩味時刻工作室     \n" +
          "    (五寮尖山羊乳)      \n" +
          "========================\n";
        
        addBytes(encodeToCP936(headerStr));

        // 4. 靠左對齊 (ESC a 0)
        addBytes([0x1B, 0x61, 0x00]);

        const now = new Date();
        const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        const bodyStr = 
          "設備：XP-Q90EC\n" +
          "編碼：GB18030 (CP936)\n" +
          `時間：${timeStr}\n` +
          "狀態：中文亂碼測試成功！\n\n\n\n";
        
        addBytes(encodeToCP936(bodyStr));

        // 5. 部分切刀 (GS V 66 0)
        addBytes([0x1D, 0x56, 0x42, 0x00]);

        // Execute transmission
        const finalBuffer = new Uint8Array(payload);
        await sendRawBytes(finalBuffer);
        
      } catch (error) {
        log(`列印錯誤: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
